<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Controlled 3D Particles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #020205;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    #webcam-panel {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 50;
      pointer-events: none;
    }
    /* Indikator Aksi yang Jelas */
    #action-badge {
      margin-bottom: 10px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(8, 8, 14, 0.88);
      backdrop-filter: blur(14px);
      border: 1.5px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    #action-badge .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px currentColor;
    }
    #webcam-box {
      width: 220px;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.9;
    }
    #skeleton-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Three.js & MediaPipe via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="webcam-panel">
    <!-- Indikator Aksi Terang & Jelas -->
    <div id="action-badge">
      <div class="dot" id="badge-dot"></div>
      <span id="badge-text">🌌 Mode Rileks: Nebula Galaxy</span>
    </div>
    
    <div id="webcam-box">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="skeleton-canvas" width="220" height="160"></canvas>
    </div>
  </div>

  <script>
    // =======================================================
    // 1. WEB AUDIO SYNTHESIZER
    // =======================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.lastTrigger = 0;
        this.currentGesture = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playSound(gesture) {
        const now = performance.now();
        if (this.currentGesture === gesture && now - this.lastTrigger < 800) return;
        this.currentGesture = gesture;
        this.lastTrigger = now;
        this.init();
        if (!this.ctx) return;

        try {
          const t = this.ctx.currentTime;
          if (gesture === 'fist') {
            // Detak Jantung Bass
            const thud = (time, freq, dur) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.frequency.setValueAtTime(freq, time);
              osc.frequency.exponentialRampToValueAtTime(35, time + dur);
              gain.gain.setValueAtTime(0.001, time);
              gain.gain.linearRampToValueAtTime(0.7, time + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(time);
              osc.stop(time + dur + 0.05);
            };
            thud(t, 75, 0.16);
            thud(t + 0.22, 85, 0.22);
          } else if (gesture === 'spread') {
            // Angin & Chime Kosmik
            [261.6, 392.0, 523.2, 784.0, 1046.5].forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.frequency.setValueAtTime(f, t + i * 0.07);
              g.gain.setValueAtTime(0.001, t + i * 0.07);
              g.gain.linearRampToValueAtTime(0.15, t + i * 0.07 + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.07 + 0.8);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(t + i * 0.07);
              osc.stop(t + i * 0.07 + 0.85);
            });
          } else if (gesture === 'index') {
            // Harpa Romantis (LOVE YOU)
            [523.2, 659.2, 784.0, 987.7, 1174.6].forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(f, t + i * 0.06);
              g.gain.setValueAtTime(0.001, t + i * 0.06);
              g.gain.linearRampToValueAtTime(0.2, t + i * 0.06 + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.06 + 1.0);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(t + i * 0.06);
              osc.stop(t + i * 0.06 + 1.1);
            });
          } else if (gesture === 'thumb') {
            // Kristal Aurora (MISS YOU)
            [392.0, 466.1, 587.3, 698.4, 880.0].forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.frequency.setValueAtTime(f, t + i * 0.05);
              g.gain.setValueAtTime(0.001, t + i * 0.05);
              g.gain.linearRampToValueAtTime(0.18, t + i * 0.05 + 0.03);
              g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.05 + 1.2);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(t + i * 0.05);
              osc.stop(t + i * 0.05 + 1.3);
            });
          } else if (gesture === 'middle') {
            // Cyber 808 Bass Punch (FUCK YOU)
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, t);
            osc.frequency.exponentialRampToValueAtTime(38, t + 0.35);
            g.gain.setValueAtTime(0.8, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.5);
          }
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();
    window.addEventListener('click', () => sound.init(), { once: true });
    window.addEventListener('touchstart', () => sound.init(), { once: true });

    // =======================================================
    // 2. THREE.JS PARTICLE ENGINE DENGAN BENTUK & TEKS TAJAM
    // =======================================================
    const PARTICLE_COUNT = 16000;
    let scene, camera, renderer, particles, geometry;
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentColors = new Float32Array(PARTICLE_COUNT * 3);
    let targetColors = new Float32Array(PARTICLE_COUNT * 3);
    let velocities = new Float32Array(PARTICLE_COUNT * 3);

    let activeGesture = 'idle';

    // Tekstur partikel tajam dan berpijar
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.18, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.38, 'rgba(240, 245, 255, 0.6)');
      grad.addColorStop(0.65, 'rgba(180, 210, 255, 0.18)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }

    // 0. Idle: Galaksi Nebula Spiral
    function getIdleNebula() {
      const pos = new Float32Array(PARTICLE_COUNT * 3);
      const col = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        const r = Math.pow(Math.random(), 1.6) * 16;
        const armAngle = ((i % 4) * (Math.PI * 2)) / 4;
        const spin = r * 0.48;
        const offset = (Math.random() - 0.5) * (1.0 + r * 0.15);

        pos[idx] = Math.cos(armAngle + spin) * r + offset;
        pos[idx + 1] = (Math.random() - 0.5) * (0.8 + (16 - r) * 0.15);
        pos[idx + 2] = Math.sin(armAngle + spin) * r + offset;

        const core = Math.max(0, 1 - r / 10);
        if (core > 0.65) {
          col[idx] = 1.0; col[idx + 1] = 0.95; col[idx + 2] = 0.7;
        } else {
          const p = Math.random();
          if (p < 0.35) { col[idx] = 0.05; col[idx + 1] = 0.88; col[idx + 2] = 0.98; }
          else if (p < 0.7) { col[idx] = 0.88; col[idx + 1] = 0.12; col[idx + 2] = 0.98; }
          else { col[idx] = 1.0; col[idx + 1] = 0.65; col[idx + 2] = 0.25; }
        }
      }
      return { pos, col };
    }

    // 1. Kepalan Tangan: Jantung 3D Penuh & Berdetak
    function getHeartPositions() {
      const pos = new Float32Array(PARTICLE_COUNT * 3);
      const col = new Float32Array(PARTICLE_COUNT * 3);
      const BODY_COUNT = Math.floor(PARTICLE_COUNT * 0.9);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        if (i < BODY_COUNT) {
          const t = Math.random() * Math.PI * 2;
          const v = (Math.random() - 0.5) * Math.PI;
          const cosV = Math.cos(v);
          const sinV = Math.sin(v);
          const vol = Math.pow(Math.random(), 0.35) * 0.38 + 0.62;

          const hx = 16 * Math.pow(Math.sin(t), 3) * cosV;
          const hy = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * cosV;
          const hz = 8 * sinV;

          const scale = 0.38 * vol;
          pos[idx] = hx * scale;
          pos[idx + 1] = hy * scale + 0.6;
          pos[idx + 2] = hz * scale;

          if (vol < 0.76) {
            col[idx] = 1.0; col[idx + 1] = 0.85; col[idx + 2] = 0.4;
          } else {
            col[idx] = 1.0; col[idx + 1] = 0.05; col[idx + 2] = 0.35;
          }
        } else {
          const phi = Math.random() * Math.PI * 2;
          const theta = Math.random() * Math.PI;
          const r = 5.2 + Math.random() * 2.2;
          pos[idx] = r * Math.sin(theta) * Math.cos(phi);
          pos[idx + 1] = r * Math.cos(theta) * 0.85 + 0.6;
          pos[idx + 2] = r * Math.sin(theta) * Math.sin(phi);
          col[idx] = 1.0; col[idx + 1] = 0.85; col[idx + 2] = 0.4;
        }
      }
      return { pos, col };
    }

    // 2. Telapak Melebar: Tata Surya Lengkap dengan Garis Orbit Pas Layar
    function getSolarSystem() {
      const pos = new Float32Array(PARTICLE_COUNT * 3);
      const col = new Float32Array(PARTICLE_COUNT * 3);
      let p = 0;

      // Matahari
      for (let i = 0; i < 3000; i++) {
        const idx = p * 3;
        const u = Math.random() * Math.PI * 2;
        const v = Math.random() * Math.PI;
        const r = Math.pow(Math.random(), 0.55) * 1.8;
        pos[idx] = r * Math.sin(v) * Math.cos(u);
        pos[idx + 1] = r * Math.cos(v);
        pos[idx + 2] = r * Math.sin(v) * Math.sin(u);
        if (r < 0.9) { col[idx] = 1.0; col[idx + 1] = 1.0; col[idx + 2] = 0.9; }
        else { col[idx] = 1.0; col[idx + 1] = 0.6; col[idx + 2] = 0.1; }
        p++;
      }

      // Planet & Orbit
      const planets = [
        { dist: 2.8, size: 0.32, count: 450, r: 0.85, g: 0.75, b: 0.65 },
        { dist: 4.0, size: 0.48, count: 700, r: 1.0, g: 0.82, b: 0.4 },
        { dist: 5.4, size: 0.55, count: 1200, r: 0.1, g: 0.75, b: 1.0 },
        { dist: 6.8, size: 0.42, count: 650, r: 1.0, g: 0.32, b: 0.15 },
        { dist: 8.8, size: 1.15, count: 2000, r: 0.95, g: 0.65, b: 0.35 },
        { dist: 11.2, size: 0.95, count: 2500, r: 0.98, g: 0.85, b: 0.5, saturn: true },
        { dist: 13.0, size: 0.7, count: 700, r: 0.35, g: 0.95, b: 0.95 },
        { dist: 14.6, size: 0.7, count: 750, r: 0.2, g: 0.55, b: 1.0 }
      ];

      planets.forEach((pl, idxPl) => {
        const ang = (idxPl * 1.38) % (Math.PI * 2);
        const cx = Math.cos(ang) * pl.dist;
        const cz = Math.sin(ang) * pl.dist;

        for (let i = 0; i < pl.count && p < PARTICLE_COUNT; i++) {
          const idx = p * 3;
          if (pl.saturn && i > pl.count * 0.35) {
            const rAng = Math.random() * Math.PI * 2;
            const rRad = pl.size * 1.45 + Math.random() * pl.size * 2.2;
            pos[idx] = cx + Math.cos(rAng) * rRad;
            pos[idx + 1] = Math.cos(rAng) * rRad * 0.32;
            pos[idx + 2] = cz + Math.sin(rAng) * rRad;
            col[idx] = 1.0; col[idx + 1] = 0.88; col[idx + 2] = 0.55;
          } else {
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI;
            const pr = Math.pow(Math.random(), 0.55) * pl.size;
            pos[idx] = cx + pr * Math.sin(v) * Math.cos(u);
            pos[idx + 1] = pr * Math.cos(v);
            pos[idx + 2] = cz + pr * Math.sin(v) * Math.sin(u);
            col[idx] = pl.r; col[idx + 1] = pl.g; col[idx + 2] = pl.b;
          }
          p++;
        }
      });

      // Garis Orbit Konsentris
      while (p < PARTICLE_COUNT) {
        const idx = p * 3;
        const pl = planets[p % planets.length];
        const a = Math.random() * Math.PI * 2;
        pos[idx] = Math.cos(a) * pl.dist;
        pos[idx + 1] = (Math.random() - 0.5) * 0.08;
        pos[idx + 2] = Math.sin(a) * pl.dist;
        col[idx] = 0.3; col[idx + 1] = 0.75; col[idx + 2] = 1.0;
        p++;
      }
      return { pos, col };
    }

    // 3. Teks Partikel Padat & Tajam (LOVE YOU, MISS YOU, FUCK YOU)
    function getTextParticles(text, sub, scheme) {
      const pos = new Float32Array(PARTICLE_COUNT * 3);
      const col = new Float32Array(PARTICLE_COUNT * 3);

      const canvas = document.createElement('canvas');
      canvas.width = 1000;
      canvas.height = 320;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'white';
      ctx.font = '900 135px "Arial Black", Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 - (sub ? 26 : 0));
      if (sub) {
        ctx.font = '700 36px Arial, sans-serif';
        ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 76);
      }

      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = [];
      const step = 2;
      const scale = 0.021; // Skala pas di layar tanpa terpotong

      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          const alpha = img.data[(y * canvas.width + x) * 4];
          if (alpha > 120) {
            pixels.push({
              x: (x - canvas.width / 2) * scale,
              y: -(y - canvas.height / 2) * scale,
              isEdge: alpha < 210
            });
          }
        }
      }

      // 92% Partikel langsung membentuk huruf secara padat
      const textCount = Math.min(pixels.length, Math.floor(PARTICLE_COUNT * 0.92));
      let p = 0;
      for (let i = 0; i < textCount && p < PARTICLE_COUNT; i++) {
        const idx = p * 3;
        const px = pixels[Math.floor((i / textCount) * pixels.length)];
        
        // Z terkunci datar agar teks razor-sharp dan tidak buram
        pos[idx] = px.x;
        pos[idx + 1] = px.y;
        pos[idx + 2] = (Math.random() - 0.5) * 0.05;

        const blend = (px.x + 8) / 16;
        if (scheme === 'romantic') {
          if (!px.isEdge && Math.random() > 0.35) {
            // Inti Putih Cerah
            col[idx] = 1.0; col[idx + 1] = 0.95; col[idx + 2] = 0.95;
          } else {
            // Tepi Merah Mawar & Magenta
            col[idx] = 1.0; col[idx + 1] = 0.05 + blend * 0.2; col[idx + 2] = 0.45 + (1 - blend) * 0.45;
          }
        } else if (scheme === 'celestial') {
          if (!px.isEdge && Math.random() > 0.35) {
            col[idx] = 0.95; col[idx + 1] = 1.0; col[idx + 2] = 1.0;
          } else {
            col[idx] = 0.05 + blend * 0.6; col[idx + 1] = 0.85 - blend * 0.25; col[idx + 2] = 1.0;
          }
        } else {
          if (!px.isEdge && Math.random() > 0.35) {
            col[idx] = 1.0; col[idx + 1] = 1.0; col[idx + 2] = 0.8;
          } else {
            col[idx] = 1.0; col[idx + 1] = 0.02 + blend * 0.15; col[idx + 2] = 0.55 - blend * 0.4;
          }
        }
        p++;
      }

      // Sisa partikel sebagai kilau bintang di sekeliling
      while (p < PARTICLE_COUNT) {
        const idx = p * 3;
        const ang = Math.random() * Math.PI * 2;
        const r = 9.5 + Math.random() * 4.5;
        pos[idx] = Math.cos(ang) * r;
        pos[idx + 1] = Math.sin(ang) * (r * 0.55);
        pos[idx + 2] = (Math.random() - 0.5) * 1.5;
        col[idx] = scheme === 'romantic' ? 1.0 : (scheme === 'celestial' ? 0.3 : 1.0);
        col[idx + 1] = scheme === 'romantic' ? 0.4 : (scheme === 'celestial' ? 0.8 : 0.2);
        col[idx + 2] = scheme === 'romantic' ? 0.6 : (scheme === 'celestial' ? 1.0 : 0.5);
        p++;
      }

      return { pos, col };
    }

    const shapes = {
      idle: getIdleNebula(),
      fist: getHeartPositions(),
      spread: getSolarSystem(),
      index: getTextParticles('LOVE YOU', '❤️ FOREVER & ALWAYS ❤️', 'romantic'),
      thumb: getTextParticles('MISS YOU', '✨ EVERY MOMENT ✨', 'celestial'),
      middle: getTextParticles('FUCK YOU', '⚡ REBEL ATTITUDE ⚡', 'cyberpunk')
    };

    function initThreeJS() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 15;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x020205, 1);
      container.appendChild(renderer.domElement);

      geometry = new THREE.BufferGeometry();
      const initData = shapes.idle;
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = initData.pos[i];
        targetPositions[i] = initData.pos[i];
        currentColors[i] = initData.col[i];
        targetColors[i] = initData.col[i];
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(currentColors, 3));

      // Ukuran partikel 0.13 agar tajam dan tidak bleed
      const material = new THREE.PointsMaterial({
        size: 0.13,
        map: createGlowTexture(),
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.95,
        depthWrite: false
      });

      particles = new THREE.Points(geometry, material);
      scene.add(particles);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    const gestureDetails = {
      idle: { text: '🌌 Mode Rileks: Nebula Galaxy', color: '#38bdf8' },
      fist: { text: '❤️ Kepalan Tangan: 3D Beating Heart', color: '#ff1493' },
      spread: { text: '🪐 Telapak Melebar: Tata Surya & Planet', color: '#fbbf24' },
      index: { text: '💖 Jari Telunjuk: LOVE YOU', color: '#f43f5e' },
      thumb: { text: '✨ Jari Jempol: MISS YOU', color: '#0ea5e9' },
      middle: { text: '⚡ Jari Tengah: FUCK YOU', color: '#f43f5e' }
    };

    function setGesture(g) {
      if (activeGesture === g) return;
      activeGesture = g;
      sound.playSound(g);

      const target = shapes[g] || shapes.idle;
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        targetPositions[i] = target.pos[i];
        targetColors[i] = target.col[i];
        velocities[i] += (Math.random() - 0.5) * 0.8;
      }

      // Perbarui Indikator Aksi
      const info = gestureDetails[g] || gestureDetails.idle;
      const badge = document.getElementById('action-badge');
      const badgeDot = document.getElementById('badge-dot');
      const badgeText = document.getElementById('badge-text');
      const webcamBox = document.getElementById('webcam-box');

      if (badge && badgeText) {
        badge.style.borderColor = info.color;
        badge.style.boxShadow = `0 0 20px ${info.color}66`;
        badgeDot.style.background = info.color;
        badgeText.textContent = info.text;
      }
      if (webcamBox) {
        webcamBox.style.borderColor = info.color;
        webcamBox.style.boxShadow = `0 0 25px ${info.color}44`;
      }
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();
      const pos = geometry.attributes.position.array;
      const col = geometry.attributes.color.array;

      const isHeart = activeGesture === 'fist';
      const isSolar = activeGesture === 'spread';
      const isText = activeGesture === 'index' || activeGesture === 'thumb' || activeGesture === 'middle';

      let pulse = 1.0;
      if (isHeart) {
        const beat = (elapsedTime * 1.8) % 1.0;
        if (beat < 0.15) pulse = 1.0 + Math.sin((beat / 0.15) * Math.PI) * 0.18;
        else if (beat < 0.35) pulse = 1.0 + Math.sin(((beat - 0.15) / 0.2) * Math.PI) * 0.1;
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let tx = targetPositions[idx];
        let ty = targetPositions[idx + 1];
        let tz = targetPositions[idx + 2];

        if (isHeart) {
          tx *= pulse; ty *= pulse; tz *= pulse;
        } else if (isSolar && i >= 3000 && i < 11500) {
          const d = Math.sqrt(tx * tx + tz * tz);
          if (d > 2.0) {
            const ang = Math.atan2(tz, tx) + (0.22 / Math.sqrt(d)) * (elapsedTime * 0.4);
            tx = Math.cos(ang) * d; tz = Math.sin(ang) * d;
          }
        } else if (isText) {
          // Melayang lembut tanpa merusak bentuk huruf
          ty += Math.sin(elapsedTime * 1.5) * 0.1;
        }

        velocities[idx] = velocities[idx] * 0.85 + (tx - pos[idx]) * 0.075;
        velocities[idx + 1] = velocities[idx + 1] * 0.85 + (ty - pos[idx + 1]) * 0.075;
        velocities[idx + 2] = velocities[idx + 2] * 0.85 + (tz - pos[idx + 2]) * 0.075;

        pos[idx] += velocities[idx];
        pos[idx + 1] += velocities[idx + 1];
        pos[idx + 2] += velocities[idx + 2];

        col[idx] += (targetColors[idx] - col[idx]) * 0.08;
        col[idx + 1] += (targetColors[idx + 1] - col[idx + 1]) * 0.08;
        col[idx + 2] += (targetColors[idx + 2] - col[idx + 2]) * 0.08;
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;

      if (isSolar) {
        particles.rotation.y = elapsedTime * 0.05;
        particles.rotation.x = 0.42;
      } else if (isHeart) {
        particles.rotation.y = Math.sin(elapsedTime * 0.7) * 0.2;
        particles.rotation.x = 0;
      } else if (isText) {
        // Teks dikunci 100% menghadap depan agar terbaca sempurna
        particles.rotation.x = 0;
        particles.rotation.y = 0;
        particles.rotation.z = 0;
      } else {
        particles.rotation.y = elapsedTime * 0.08;
        particles.rotation.x = 0.35;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // =======================================================
    // 3. MEDIAPIPE GESTURE DETECTION YANG RESPONSIF
    // =======================================================
    function dist(p1, p2) {
      const dx = p1.x - p2.x, dy = p1.y - p2.y, dz = (p1.z || 0) - (p2.z || 0);
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    function detectGesture(lm) {
      if (!lm || lm.length < 21) return 'idle';
      const wrist = lm[0];
      const indexMcp = lm[5];
      const pinkyMcp = lm[17];
      const handScale = Math.max(0.1, dist(wrist, indexMcp));

      // Deteksi jari lurus tanpa dipengaruhi kemiringan rotasi
      const isIndex = dist(lm[8], wrist) > dist(lm[6], wrist) * 1.14 && dist(lm[8], lm[5]) > dist(lm[6], lm[5]) * 1.18;
      const isMiddle = dist(lm[12], wrist) > dist(lm[10], wrist) * 1.14 && dist(lm[12], lm[9]) > dist(lm[10], lm[9]) * 1.18;
      const isRing = dist(lm[16], wrist) > dist(lm[14], wrist) * 1.14 && dist(lm[16], lm[13]) > dist(lm[14], lm[13]) * 1.18;
      const isPinky = dist(lm[20], wrist) > dist(lm[18], wrist) * 1.14 && dist(lm[20], lm[17]) > dist(lm[18], lm[17]) * 1.18;

      const thumbDistToPinky = dist(lm[4], pinkyMcp);
      const thumbDistToMiddleMcp = dist(lm[4], lm[9]);
      const isThumbExtended = thumbDistToPinky > handScale * 1.25 && thumbDistToMiddleMcp > handScale * 0.9;
      const isThumbCurled = thumbDistToMiddleMcp < handScale * 0.75 || thumbDistToPinky < handScale * 0.95;

      const openCount = (isIndex ? 1 : 0) + (isMiddle ? 1 : 0) + (isRing ? 1 : 0) + (isPinky ? 1 : 0);

      // 1. JARI TELUNJUK -> LOVE YOU
      if (isIndex && !isMiddle && !isRing && !isPinky) return 'index';

      // 2. JARI TENGAH -> FUCK YOU
      if (isMiddle && !isIndex && !isRing && !isPinky) return 'middle';

      // 3. JARI JEMPOL -> MISS YOU
      if (isThumbExtended && openCount === 0) return 'thumb';

      // 4. KEPALAN TANGAN -> 3D HEART
      if (openCount === 0 && isThumbCurled) return 'fist';

      // 5. TELAPAK MELEBAR -> TATA SURYA
      if (openCount >= 4 || openCount >= 3) return 'spread';

      if (openCount === 0) return 'fist';

      return activeGesture;
    }

    const skelCanvas = document.getElementById('skeleton-canvas');
    const skelCtx = skelCanvas.getContext('2d');

    function drawSkeleton(landmarks) {
      skelCtx.clearRect(0, 0, skelCanvas.width, skelCanvas.height);
      if (!landmarks) return;

      const conn = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],
        [5,9],[9,13],[13,17]
      ];

      const col = gestureDetails[activeGesture]?.color || '#38bdf8';
      skelCtx.strokeStyle = col;
      skelCtx.lineWidth = 2;
      skelCtx.shadowColor = col;
      skelCtx.shadowBlur = 8;

      conn.forEach(([i, j]) => {
        const p1 = landmarks[i], p2 = landmarks[j];
        skelCtx.beginPath();
        skelCtx.moveTo((1 - p1.x) * skelCanvas.width, p1.y * skelCanvas.height);
        skelCtx.lineTo((1 - p2.x) * skelCanvas.width, p2.y * skelCanvas.height);
        skelCtx.stroke();
      });
    }

    // Inisialisasi
    initThreeJS();

    const videoElement = document.getElementById('webcam');
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        drawSkeleton(lm);
        const g = detectGesture(lm);
        setGesture(g);
      } else {
        drawSkeleton(null);
        setGesture('idle');
      }
    });

    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } })
      .then((stream) => {
        videoElement.srcObject = stream;
        const cameraUtils = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
          },
          width: 480,
          height: 360
        });
        cameraUtils.start();
      })
      .catch((err) => {
        console.error("Izin webcam ditolak atau kamera tidak ditemukan:", err);
      });
  </script>
</body>
</html>

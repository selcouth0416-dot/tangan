<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Gesture Particles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #020205;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    /* Kotak Webcam Bersih Tanpa Teks */
    #webcam-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 220px;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      z-index: 50;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.9;
    }
    #skeleton-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>

  <!-- Three.js & MediaPipe Hands CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Layar Partikel Penuh -->
  <div id="canvas-container"></div>

  <!-- Frame Kamera (Bersih Tanpa Teks) -->
  <div id="webcam-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="skeleton-canvas" width="220" height="160"></canvas>
  </div>

  <script>
    // =========================================================================
    // 1. WEB AUDIO SYNTHESIZER
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.lastTrigger = 0;
        this.currentGesture = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      play(gesture) {
        const now = performance.now();
        if (this.currentGesture === gesture && now - this.lastTrigger < 700) return;
        this.currentGesture = gesture;
        this.lastTrigger = now;
        this.init();
        if (!this.ctx) return;

        try {
          const t = this.ctx.currentTime;
          if (gesture === 'fist') {
            const beat = (time, freq, dur) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.frequency.setValueAtTime(freq, time);
              osc.frequency.exponentialRampToValueAtTime(32, time + dur);
              g.gain.setValueAtTime(0.001, time);
              g.gain.linearRampToValueAtTime(0.65, time + 0.02);
              g.gain.exponentialRampToValueAtTime(0.001, time + dur);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(time);
              osc.stop(time + dur + 0.05);
            };
            beat(t, 75, 0.16);
            beat(t + 0.22, 85, 0.22);
          } else if (gesture === 'spread') {
            [261.6, 392.0, 523.2, 784.0, 1046.5].forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.frequency.setValueAtTime(f, t + i * 0.06);
              g.gain.setValueAtTime(0.001, t + i * 0.06);
              g.gain.linearRampToValueAtTime(0.15, t + i * 0.06 + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.06 + 0.8);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(t + i * 0.06);
              osc.stop(t + i * 0.06 + 0.85);
            });
          } else if (gesture === 'index') {
            [523.2, 659.2, 784.0, 987.7, 1174.6].forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(f, t + i * 0.06);
              g.gain.setValueAtTime(0.001, t + i * 0.06);
              g.gain.linearRampToValueAtTime(0.2, t + i * 0.06 + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.06 + 1.0);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(t + i * 0.06);
              osc.stop(t + i * 0.06 + 1.1);
            });
          } else if (gesture === 'thumb') {
            [392.0, 466.1, 587.3, 698.4, 880.0].forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.frequency.setValueAtTime(f, t + i * 0.05);
              g.gain.setValueAtTime(0.001, t + i * 0.05);
              g.gain.linearRampToValueAtTime(0.18, t + i * 0.05 + 0.03);
              g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.05 + 1.2);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(t + i * 0.05);
              osc.stop(t + i * 0.05 + 1.3);
            });
          } else if (gesture === 'middle') {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(36, t + 0.35);
            g.gain.setValueAtTime(0.7, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.5);
          }
        } catch (e) {}
      }
    }
    const sound = new SoundEngine();
    window.addEventListener('click', () => sound.init(), { once: true });
    window.addEventListener('touchstart', () => sound.init(), { once: true });

    // =========================================================================
    // 2. THREE.JS 3D PARTICLE ENGINE DENGAN BENTUK EKSTRUSI 3D
    // =========================================================================
    const PARTICLE_COUNT = 16000;
    let scene, camera, renderer, particles, geometry, particleMaterial;
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentColors = new Float32Array(PARTICLE_COUNT * 3);
    let targetColors = new Float32Array(PARTICLE_COUNT * 3);
    let velocities = new Float32Array(PARTICLE_COUNT * 3);

    let activeGesture = 'idle';
    let transitionTimer = 0.0;
    const baseParticleSize = 0.13;

    // Data tracking 3D tangan
    const hand3D = {
      rotX: 0, rotY: 0, rotZ: 0,
      transX: 0, transY: 0,
      scale: 1.0,
      targetRotX: 0, targetRotY: 0, targetRotZ: 0,
      targetTransX: 0, targetTransY: 0,
      targetScale: 1.0
    };

    function createParticleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.18, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.38, 'rgba(240, 245, 255, 0.6)');
      grad.addColorStop(0.65, 'rgba(180, 210, 255, 0.18)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }

    // 0. Nebula Galaxy
    function getIdleNebula() {
      const pos = new Float32Array(PARTICLE_COUNT * 3);
      const col = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        const r = Math.pow(Math.random(), 1.6) * 16;
        const armAngle = ((i % 4) * (Math.PI * 2)) / 4;
        const spin = r * 0.48;
        const offset = (Math.random() - 0.5) * (1.0 + r * 0.15);

        pos[idx] = Math.cos(armAngle + spin) * r + offset;
        pos[idx + 1] = (Math.random() - 0.5) * (0.8 + (16 - r) * 0.15);
        pos[idx + 2] = Math.sin(armAngle + spin) * r + offset;

        const core = Math.max(0, 1 - r / 10);
        if (core > 0.65) {
          col[idx] = 1.0; col[idx + 1] = 0.95; col[idx + 2] = 0.7;
        } else {
          const p = Math.random();
          if (p < 0.35) { col[idx] = 0.05; col[idx + 1] = 0.88; col[idx + 2] = 0.98; }
          else if (p < 0.7) { col[idx] = 0.88; col[idx + 1] = 0.12; col[idx + 2] = 0.98; }
          else { col[idx] = 1.0; col[idx + 1] = 0.65; col[idx + 2] = 0.25; }
        }
      }
      return { pos, col };
    }

    // 1. Kepalan Tangan: Jantung 3D Penuh & Berdetak
    function getHeartPositions() {
      const pos = new Float32Array(PARTICLE_COUNT * 3);
      const col = new Float32Array(PARTICLE_COUNT * 3);
      const BODY_COUNT = Math.floor(PARTICLE_COUNT * 0.92);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        if (i < BODY_COUNT) {
          const t = Math.random() * Math.PI * 2;
          const v = (Math.random() - 0.5) * Math.PI;
          const cosV = Math.cos(v);
          const sinV = Math.sin(v);
          const vol = Math.pow(Math.random(), 0.35) * 0.38 + 0.62;

          const hx = 16 * Math.pow(Math.sin(t), 3) * cosV;
          const hy = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * cosV;
          const hz = 8 * sinV;

          const scale = 0.38 * vol;
          pos[idx] = hx * scale;
          pos[idx + 1] = hy * scale + 0.6;
          pos[idx + 2] = hz * scale;

          if (vol < 0.75) {
            col[idx] = 1.0; col[idx + 1] = 0.88; col[idx + 2] = 0.45;
          } else {
            col[idx] = 1.0; col[idx + 1] = 0.05; col[idx + 2] = 0.35;
          }
        } else {
          const phi = Math.random() * Math.PI * 2;
          const theta = Math.random() * Math.PI;
          const r = 5.2 + Math.random() * 2.2;
          pos[idx] = r * Math.sin(theta) * Math.cos(phi);
          pos[idx + 1] = r * Math.cos(theta) * 0.85 + 0.6;
          pos[idx + 2] = r * Math.sin(theta) * Math.sin(phi);
          col[idx] = 1.0; col[idx + 1] = 0.85; col[idx + 2] = 0.4;
        }
      }
      return { pos, col };
    }

    // 2. Telapak Melebar: Tata Surya 3D Lengkap
    function getSolarSystem() {
      const pos = new Float32Array(PARTICLE_COUNT * 3);
      const col = new Float32Array(PARTICLE_COUNT * 3);
      let p = 0;

      // Matahari
      for (let i = 0; i < 3000; i++) {
        const idx = p * 3;
        const u = Math.random() * Math.PI * 2;
        const v = Math.random() * Math.PI;
        const r = Math.pow(Math.random(), 0.55) * 1.8;
        pos[idx] = r * Math.sin(v) * Math.cos(u);
        pos[idx + 1] = r * Math.cos(v);
        pos[idx + 2] = r * Math.sin(v) * Math.sin(u);
        if (r < 0.9) { col[idx] = 1.0; col[idx + 1] = 1.0; col[idx + 2] = 0.9; }
        else { col[idx] = 1.0; col[idx + 1] = 0.6; col[idx + 2] = 0.1; }
        p++;
      }

      // 8 Planet Berwarna
      const planets = [
        { dist: 2.8, size: 0.32, count: 450, r: 0.85, g: 0.75, b: 0.65 },
        { dist: 4.0, size: 0.48, count: 700, r: 1.0, g: 0.82, b: 0.4 },
        { dist: 5.4, size: 0.55, count: 1200, r: 0.1, g: 0.75, b: 1.0 },
        { dist: 6.8, size: 0.42, count: 650, r: 1.0, g: 0.32, b: 0.15 },
        { dist: 8.8, size: 1.15, count: 2000, r: 0.95, g: 0.65, b: 0.35 },
        { dist: 11.2, size: 0.95, count: 2500, r: 0.98, g: 0.85, b: 0.5, saturn: true },
        { dist: 13.0, size: 0.7, count: 700, r: 0.35, g: 0.95, b: 0.95 },
        { dist: 14.6, size: 0.7, count: 750, r: 0.2, g: 0.55, b: 1.0 }
      ];

      planets.forEach((pl, idxPl) => {
        const ang = (idxPl * 1.38) % (Math.PI * 2);
        const cx = Math.cos(ang) * pl.dist;
        const cz = Math.sin(ang) * pl.dist;

        for (let i = 0; i < pl.count && p < PARTICLE_COUNT; i++) {
          const idx = p * 3;
          if (pl.saturn && i > pl.count * 0.35) {
            const rAng = Math.random() * Math.PI * 2;
            const rRad = pl.size * 1.45 + Math.random() * pl.size * 2.2;
            pos[idx] = cx + Math.cos(rAng) * rRad;
            pos[idx + 1] = Math.cos(rAng) * rRad * 0.32;
            pos[idx + 2] = cz + Math.sin(rAng) * rRad;
            col[idx] = 1.0; col[idx + 1] = 0.88; col[idx + 2] = 0.55;
          } else {
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI;
            const pr = Math.pow(Math.random(), 0.55) * pl.size;
            pos[idx] = cx + pr * Math.sin(v) * Math.cos(u);
            pos[idx + 1] = pr * Math.cos(v);
            pos[idx + 2] = cz + pr * Math.sin(v) * Math.sin(u);
            col[idx] = pl.r; col[idx + 1] = pl.g; col[idx + 2] = pl.b;
          }
          p++;
        }
      });

      // Garis Orbit
      while (p < PARTICLE_COUNT) {
        const idx = p * 3;
        const pl = planets[p % planets.length];
        const a = Math.random() * Math.PI * 2;
        pos[idx] = Math.cos(a) * pl.dist;
        pos[idx + 1] = (Math.random() - 0.5) * 0.08;
        pos[idx + 2] = Math.sin(a) * pl.dist;
        col[idx] = 0.3; col[idx + 1] = 0.75; col[idx + 2] = 1.0;
        p++;
      }
      return { pos, col };
    }

    // 3. Huruf 3D Ekstrusi Tebal & Sangat Jelas (Dua Baris Bersusun)
    function create3DText(topWord, bottomWord, scheme) {
      const pos = new Float32Array(PARTICLE_COUNT * 3);
      const col = new Float32Array(PARTICLE_COUNT * 3);

      const canvas = document.createElement('canvas');
      canvas.width = 1100;
      canvas.height = 520;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'white';
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const drawSpaced = (text, centerY) => {
        ctx.font = '900 145px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tracking = 18; // Spasi agar huruf tidak bertabrakan
        const letters = text.split('');
        const widths = letters.map(ch => ctx.measureText(ch).width);
        const totalW = widths.reduce((a, b) => a + b, 0) + (letters.length - 1) * tracking;
        let curX = (canvas.width - totalW) / 2;

        letters.forEach((ch, idx) => {
          const charW = widths[idx];
          const posX = curX + charW / 2;
          ctx.strokeText(ch, posX, centerY);
          ctx.fillText(ch, posX, centerY);
          curX += charW + tracking;
        });
      };

      drawSpaced(topWord, 160);
      drawSpaced(bottomWord, 360);

      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = [];
      const step = 2;
      const scale = 0.021;

      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          const alpha = img.data[(y * canvas.width + x) * 4];
          if (alpha > 120) {
            pixels.push({
              x: (x - canvas.width / 2) * scale,
              y: -(y - canvas.height / 2) * scale,
              isEdge: alpha < 225
            });
          }
        }
      }

      // 95% Partikel membentuk huruf 3D bervolume
      const textCount = Math.min(pixels.length, Math.floor(PARTICLE_COUNT * 0.95));
      let p = 0;

      for (let i = 0; i < textCount && p < PARTICLE_COUNT; i++) {
        const idx = p * 3;
        const px = pixels[Math.floor((i / textCount) * pixels.length)];

        // Kedalaman 3D 3 Lapisan (Depan, Sisi Bevel, Belakang)
        const layer = Math.random();
        let z = 0;
        if (layer < 0.38) {
          z = 0.55 + (Math.random() - 0.5) * 0.05; // Lapisan depan putih terang
        } else if (layer < 0.72) {
          z = (Math.random() - 0.5) * 1.1; // Sisi ketebalan 3D
        } else {
          z = -0.55 + (Math.random() - 0.5) * 0.05; // Lapisan belakang
        }

        pos[idx] = px.x;
        pos[idx + 1] = px.y;
        pos[idx + 2] = z;

        const blend = (px.x + 8) / 16;
        if (scheme === 'romantic') {
          if (z > 0.4 && !px.isEdge && Math.random() > 0.25) {
            col[idx] = 1.0; col[idx + 1] = 0.97; col[idx + 2] = 0.98; // Inti putih
          } else {
            col[idx] = 1.0; col[idx + 1] = 0.08 + blend * 0.18; col[idx + 2] = 0.45 + (1 - blend) * 0.45;
          }
        } else if (scheme === 'celestial') {
          if (z > 0.4 && !px.isEdge && Math.random() > 0.25) {
            col[idx] = 0.96; col[idx + 1] = 1.0; col[idx + 2] = 1.0;
          } else {
            col[idx] = 0.06 + blend * 0.55; col[idx + 1] = 0.85 - blend * 0.2; col[idx + 2] = 1.0;
          }
        } else {
          if (z > 0.4 && !px.isEdge && Math.random() > 0.25) {
            col[idx] = 1.0; col[idx + 1] = 0.98; col[idx + 2] = 0.82;
          } else {
            col[idx] = 1.0; col[idx + 1] = 0.08 + blend * 0.25; col[idx + 2] = 0.22 - blend * 0.15;
          }
        }
        p++;
      }

      // Debu bintang di sekeliling
      while (p < PARTICLE_COUNT) {
        const idx = p * 3;
        const ang = Math.random() * Math.PI * 2;
        const dist = 9.0 + Math.random() * 4.0;
        pos[idx] = Math.cos(ang) * dist;
        pos[idx + 1] = Math.sin(ang) * (dist * 0.6);
        pos[idx + 2] = (Math.random() - 0.5) * 1.5;

        if (scheme === 'romantic') {
          col[idx] = 1.0; col[idx + 1] = 0.3; col[idx + 2] = 0.6;
        } else if (scheme === 'celestial') {
          col[idx] = 0.2; col[idx + 1] = 0.8; col[idx + 2] = 1.0;
        } else {
          col[idx] = 1.0; col[idx + 1] = 0.2; col[idx + 2] = 0.3;
        }
        p++;
      }

      return { pos, col };
    }

    const shapes = {
      idle: getIdleNebula(),
      fist: getHeartPositions(),
      spread: getSolarSystem(),
      index: create3DText('LOVE', 'YOU', 'romantic'),
      thumb: create3DText('MISS', 'YOU', 'celestial'),
      middle: create3DText('FUCK', 'YOU', 'cyberpunk')
    };

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 15;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x020205, 1);
      container.appendChild(renderer.domElement);

      geometry = new THREE.BufferGeometry();
      const initData = shapes.idle;
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = initData.pos[i];
        targetPositions[i] = initData.pos[i];
        currentColors[i] = initData.col[i];
        targetColors[i] = initData.col[i];
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(currentColors, 3));

      particleMaterial = new THREE.PointsMaterial({
        size: baseParticleSize,
        map: createParticleTexture(),
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.95,
        depthWrite: false
      });

      particles = new THREE.Points(geometry, particleMaterial);
      scene.add(particles);

      window.addEventListener('resize', onResize);
      animate();
    }

    // Transisi Jelas & Meledak (Supernova Shockwave)
    function setGesture(g) {
      if (activeGesture === g) return;
      activeGesture = g;
      sound.play(g);

      transitionTimer = 1.0; // Pemicu transisi dramatis

      const target = shapes[g] || shapes.idle;
      const pos = geometry.attributes.position.array;

      for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
        targetPositions[i] = target.pos[i];
        targetPositions[i + 1] = target.pos[i + 1];
        targetPositions[i + 2] = target.pos[i + 2];

        targetColors[i] = target.col[i];
        targetColors[i + 1] = target.col[i + 1];
        targetColors[i + 2] = target.col[i + 2];

        // Efek Ledakan Melingkar Menjauhi Titik Pusat
        const px = pos[i];
        const py = pos[i + 1];
        const pz = pos[i + 2];
        const dist = Math.hypot(px, py, pz) + 0.1;
        const normX = px / dist;
        const normY = py / dist;
        const normZ = pz / dist;

        const burstSpeed = 2.4 + Math.random() * 2.8;
        velocities[i] += normX * burstSpeed + (Math.random() - 0.5) * 1.2;
        velocities[i + 1] += normY * burstSpeed + (Math.random() - 0.5) * 1.2;
        velocities[i + 2] += normZ * burstSpeed + (Math.random() - 0.5) * 1.5;
      }

      // Efek Border Box Kamera Sesuai Aksi
      const box = document.getElementById('webcam-container');
      const colors = {
        idle: '#38bdf8', fist: '#ff1493', spread: '#fbbf24',
        index: '#f43f5e', thumb: '#0ea5e9', middle: '#f43f5e'
      };
      if (box) {
        const c = colors[g] || '#38bdf8';
        box.style.borderColor = c;
        box.style.boxShadow = `0 0 25px ${c}55`;
      }
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsedTime = clock.getElapsedTime();
      const pos = geometry.attributes.position.array;
      const col = geometry.attributes.color.array;

      const isHeart = activeGesture === 'fist';
      const isSolar = activeGesture === 'spread';
      const isText = activeGesture === 'index' || activeGesture === 'thumb' || activeGesture === 'middle';

      // Haluskan gerak 3D tangan
      hand3D.rotX += (hand3D.targetRotX - hand3D.rotX) * 0.08;
      hand3D.rotY += (hand3D.targetRotY - hand3D.rotY) * 0.08;
      hand3D.rotZ += (hand3D.targetRotZ - hand3D.rotZ) * 0.08;
      hand3D.transX += (hand3D.targetTransX - hand3D.transX) * 0.08;
      hand3D.transY += (hand3D.targetTransY - hand3D.transY) * 0.08;
      hand3D.scale += (hand3D.targetScale - hand3D.scale) * 0.08;

      // Handle Transisi
      let isTransitioning = false;
      let phase = 0;
      if (transitionTimer > 0) {
        isTransitioning = true;
        transitionTimer = Math.max(0, transitionTimer - delta * 1.25);
        phase = 1.0 - transitionTimer;
        // Kilau partikel membesar saat meledak
        particleMaterial.size = baseParticleSize * (1.0 + Math.sin(phase * Math.PI) * 0.9);
      } else {
        particleMaterial.size = baseParticleSize;
      }

      const lerpSpeed = isTransitioning ? (phase < 0.35 ? 0.035 : 0.16) : 0.08;
      const damping = isTransitioning && phase < 0.35 ? 0.92 : 0.83;

      let pulse = 1.0;
      if (isHeart) {
        const beat = (elapsedTime * 1.8) % 1.0;
        if (beat < 0.15) pulse = 1.0 + Math.sin((beat / 0.15) * Math.PI) * 0.2;
        else if (beat < 0.35) pulse = 1.0 + Math.sin(((beat - 0.15) / 0.2) * Math.PI) * 0.12;
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let tx = targetPositions[idx];
        let ty = targetPositions[idx + 1];
        let tz = targetPositions[idx + 2];

        if (isHeart) {
          tx *= pulse; ty *= pulse; tz *= pulse;
        } else if (isSolar && i >= 3000 && i < 12000) {
          const d = Math.sqrt(tx * tx + tz * tz);
          if (d > 2.5) {
            const ang = Math.atan2(tz, tx) + (0.25 / Math.sqrt(d)) * (elapsedTime * 0.4);
            tx = Math.cos(ang) * d; tz = Math.sin(ang) * d;
          }
        } else if (isText) {
          // Ombak 3D di permukaan huruf
          ty += Math.sin(elapsedTime * 1.8) * 0.08;
          tz += Math.sin(elapsedTime * 2.5 + tx * 0.35) * 0.14;
        }

        velocities[idx] = velocities[idx] * damping + (tx - pos[idx]) * lerpSpeed;
        velocities[idx + 1] = velocities[idx + 1] * damping + (ty - pos[idx + 1]) * lerpSpeed;
        velocities[idx + 2] = velocities[idx + 2] * damping + (tz - pos[idx + 2]) * lerpSpeed;

        pos[idx] += velocities[idx];
        pos[idx + 1] += velocities[idx + 1];
        pos[idx + 2] += velocities[idx + 2];

        col[idx] += (targetColors[idx] - col[idx]) * 0.09;
        col[idx + 1] += (targetColors[idx + 1] - col[idx + 1]) * 0.09;
        col[idx + 2] += (targetColors[idx + 2] - col[idx + 2]) * 0.09;
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;

      // Animasi & Orientasi 3D Dinamis Merespons Tangan
      particles.scale.set(hand3D.scale, hand3D.scale, hand3D.scale);
      particles.position.x = hand3D.transX;
      particles.position.y = hand3D.transY;

      if (isSolar) {
        particles.rotation.x = 0.44 + hand3D.rotX;
        particles.rotation.y = elapsedTime * 0.05 + hand3D.rotY;
        particles.rotation.z = hand3D.rotZ;
      } else if (isHeart) {
        particles.rotation.x = hand3D.rotX * 1.2;
        particles.rotation.y = Math.sin(elapsedTime * 0.7) * 0.18 + hand3D.rotY * 1.2;
        particles.rotation.z = Math.sin(elapsedTime * 0.5) * 0.04 + hand3D.rotZ * 1.2;
      } else if (isText) {
        // Huruf 3D bergerak mengikuti kemiringan tangan
        particles.rotation.x = hand3D.rotX * 0.9;
        particles.rotation.y = hand3D.rotY * 0.9;
        particles.rotation.z = hand3D.rotZ * 0.9;
      } else {
        particles.rotation.x = 0.35 + hand3D.rotX;
        particles.rotation.y = elapsedTime * 0.08 + hand3D.rotY;
        particles.rotation.z = hand3D.rotZ;
      }

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // =========================================================================
    // 3. MEDIAPIPE GESTURE DETECTION & TRACKING 3D
    // =========================================================================
    function dist(p1, p2) {
      const dx = p1.x - p2.x, dy = p1.y - p2.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function detectGesture(lm) {
      if (!lm || lm.length < 21) return 'idle';
      const wrist = lm[0];
      const indexMcp = lm[5];
      const pinkyMcp = lm[17];
      const handScale = Math.max(0.1, dist(wrist, indexMcp));

      const isIndex = dist(lm[8], wrist) > dist(lm[6], wrist) * 1.14 && dist(lm[8], lm[5]) > dist(lm[6], lm[5]) * 1.18;
      const isMiddle = dist(lm[12], wrist) > dist(lm[10], wrist) * 1.14 && dist(lm[12], lm[9]) > dist(lm[10], lm[9]) * 1.18;
      const isRing = dist(lm[16], wrist) > dist(lm[14], wrist) * 1.14 && dist(lm[16], lm[13]) > dist(lm[14], lm[13]) * 1.18;
      const isPinky = dist(lm[20], wrist) > dist(lm[18], wrist) * 1.14 && dist(lm[20], lm[17]) > dist(lm[18], lm[17]) * 1.18;

      const thumbDistToPinky = dist(lm[4], pinkyMcp);
      const thumbDistToMiddleMcp = dist(lm[4], lm[9]);
      const isThumbExtended = thumbDistToPinky > handScale * 1.25 && thumbDistToMiddleMcp > handScale * 0.9;
      const isThumbCurled = thumbDistToMiddleMcp < handScale * 0.75 || thumbDistToPinky < handScale * 0.95;

      const openCount = (isIndex ? 1 : 0) + (isMiddle ? 1 : 0) + (isRing ? 1 : 0) + (isPinky ? 1 : 0);

      // 1. Telunjuk -> LOVE YOU
      if (isIndex && !isMiddle && !isRing && !isPinky) return 'index';
      // 2. Jari Tengah -> FUCK YOU
      if (isMiddle && !isIndex && !isRing && !isPinky) return 'middle';
      // 3. Jempol -> MISS YOU
      if (isThumbExtended && openCount === 0) return 'thumb';
      // 4. Kepalan Tangan -> Heart
      if (openCount === 0 && isThumbCurled) return 'fist';
      // 5. Melebar -> Tata Surya
      if (openCount >= 3) return 'spread';

      if (openCount === 0) return 'fist';
      return activeGesture;
    }

    const skelCanvas = document.getElementById('skeleton-canvas');
    const skelCtx = skelCanvas.getContext('2d');

    function drawSkeleton(landmarks) {
      skelCtx.clearRect(0, 0, skelCanvas.width, skelCanvas.height);
      if (!landmarks) return;

      const conn = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],
        [5,9],[9,13],[13,17]
      ];

      skelCtx.strokeStyle = '#38bdf8';
      skelCtx.lineWidth = 2;
      skelCtx.shadowColor = '#38bdf8';
      skelCtx.shadowBlur = 8;

      conn.forEach(([i, j]) => {
        const p1 = landmarks[i], p2 = landmarks[j];
        skelCtx.beginPath();
        skelCtx.moveTo((1 - p1.x) * skelCanvas.width, p1.y * skelCanvas.height);
        skelCtx.lineTo((1 - p2.x) * skelCanvas.width, p2.y * skelCanvas.height);
        skelCtx.stroke();
      });
    }

    // Inisialisasi
    initThree();

    const videoElement = document.getElementById('webcam');
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        drawSkeleton(lm);
        const g = detectGesture(lm);
        setGesture(g);

        // Ekstraksi 3D Telemetri Tangan
        const wrist = lm[0];
        const middleMcp = lm[9];
        const hx = -((wrist.x + middleMcp.x) * 0.5 - 0.5) * 2.2;
        const hy = -((wrist.y + middleMcp.y) * 0.5 - 0.5) * 2.2;
        const roll = Math.atan2(middleMcp.y - wrist.y, -(middleMcp.x - wrist.x)) - Math.PI / 2;
        const distScale = Math.hypot(wrist.x - middleMcp.x, wrist.y - middleMcp.y);

        hand3D.targetRotY = hx * 1.1 + roll * 0.7;
        hand3D.targetRotX = -hy * 0.9;
        hand3D.targetRotZ = -roll * 0.6;
        hand3D.targetTransX = hx * 1.6;
        hand3D.targetTransY = hy * 1.2;
        hand3D.targetScale = Math.min(Math.max(distScale / 0.22, 0.75), 1.45);
      } else {
        drawSkeleton(null);
        setGesture('idle');
        hand3D.targetRotX = 0;
        hand3D.targetRotY = 0;
        hand3D.targetRotZ = 0;
        hand3D.targetTransX = 0;
        hand3D.targetTransY = 0;
        hand3D.targetScale = 1.0;
      }
    });

    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } })
      .then((stream) => {
        videoElement.srcObject = stream;
        const cameraUtils = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
          },
          width: 480,
          height: 360
        });
        cameraUtils.start();
      })
      .catch((err) => {
        console.error("Akses kamera tidak diizinkan atau tidak ditemukan:", err);
      });
  </script>
